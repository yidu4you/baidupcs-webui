name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 문법 검사
        run: |
          pip install -r requirements.txt
          python -m compileall -q app
          BAIDUPCS_GO_CONFIG_DIR=/tmp/pcs python -c "import app.main"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript 문법 검사
        run: node --check static/app.js

      - name: 셸 스크립트 검사
        run: sh -n entrypoint.sh

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 이미지 빌드 (amd64, push 안 함)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: baidupcs-webui:ci
